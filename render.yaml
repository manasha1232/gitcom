services:
  - type: web
    name: commitflow-ai
    env: node
    buildCommand: |
      cd server && npm install && npm run prisma:generate && npm run prisma:push && npm run build
      cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
