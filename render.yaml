services:
  - type: web
    name: commitflow-ai
    env: node
    buildCommand: |
      cd server && npm install && npm run prisma:generate && npm run prisma:push && npm run build
      cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    disk:
      name: commitflow-storage
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: "file:/data/dev.db"
